
services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: imobiliaria
      POSTGRES_PASSWORD: imobiliaria_dev
      POSTGRES_DB: imobiliaria_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobiliaria -d imobiliaria_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
